name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Two axes, each covering something the other cannot:
        #
        # pi version — the codex auth path branches on how credentials are read.
        #   0.80.7 is the last release with ModelRegistry.authStorage; 0.82.0 is
        #   the readStoredCredential path. Those two cover both branches, so
        #   0.79.10 would add a third job and no new coverage.
        #
        # OS — this package promises macOS and Linux, and the tmpdir, path and
        #   install-hint code is where that promise is actually kept.
        os: [ubuntu-latest, macos-latest]
        pi-version: ["0.80.7", "0.82.0"]
        include:
          - os: ubuntu-latest
            pi-version: "0.82.0"
            primary: true
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, pi ${{ matrix.pi-version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install matrix Pi packages
        run: |
          npm install --no-save --package-lock=false \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }}

      - name: Test with coverage
        id: coverage
        shell: bash
        run: |
          set +e
          node --test --experimental-strip-types --experimental-test-coverage tests/*.test.ts 2>&1 | tee coverage.txt
          status=${PIPESTATUS[0]}
          set -e

          # The gate is what the test runner reported, not its exit code.
          # `--experimental-test-coverage` injects NODE_V8_COVERAGE into every
          # spawned process — including the ones exec.ts kills to prove its
          # timeout escalation works — and one killed partway through writing
          # leaves a truncated file. The reporter then fails and node exits 1
          # with every test passing. That is a tooling crash, not a red build;
          # the coverage summary below already degrades to "unavailable".
          if [ "$status" != "0" ] && grep -qE "^. fail 0$" coverage.txt; then
            echo "Tests passed; only the coverage reporter failed."
            status=0
          fi

          summary=$(node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('coverage.txt', 'utf8');
          const line = text.split(/\r?\n/).find((item) => item.includes('all files') && item.includes('|'));
          if (!line) {
            console.log('Coverage summary unavailable.');
            process.exit(0);
          }
          const parts = line
            .replace(/^.*all files\s*\|/, '')
            .split('|')
            .map((part) => part.trim())
            .filter(Boolean);
          const [lines, branches, functions] = parts;
          console.log(`Lines ${lines}, branches ${branches}, functions ${functions}`);
          NODE
          )

          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run check

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Format check
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Runtime dependency audit
        if: matrix.primary == true
        continue-on-error: true
        run: npm run audit:runtime

      - name: Package size
        if: matrix.primary == true
        id: package
        shell: bash
        run: |
          npm pack --json > pack.json
          summary=$(node <<'NODE'
          const fs = require('node:fs');
          const [pkg] = JSON.parse(fs.readFileSync('pack.json', 'utf8'));
          const formatBytes = (bytes) => {
            const units = ['B', 'KB', 'MB', 'GB'];
            let value = bytes;
            let unit = units.shift();
            while (value >= 1024 && units.length > 0) {
              value /= 1024;
              unit = units.shift();
            }
            return `${value.toFixed(value >= 10 || unit === 'B' ? 0 : 1)} ${unit}`;
          };
          console.log(`Packed ${formatBytes(pkg.size)}, unpacked ${formatBytes(pkg.unpackedSize)}, files ${pkg.entryCount}`);
          NODE
          )
          {
            echo "summary<<EOF"
            echo "$summary"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment coverage and package size
        if: always() && matrix.primary == true && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          COVERAGE_SUMMARY: ${{ steps.coverage.outputs.summary || 'Coverage summary unavailable.' }}
          PACKAGE_SUMMARY: ${{ steps.package.outputs.summary || 'Package size unavailable.' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- pi-glean-ci-summary -->';
            const coverage = process.env.COVERAGE_SUMMARY;
            const packageSize = process.env.PACKAGE_SUMMARY;
            const body = [
              marker,
              '## CI summary',
              '',
              `- Test coverage: ${coverage}`,
              `- Package size: ${packageSize}`,
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| Tests | ${{ steps.coverage.outputs.status == '0' && 'passed' || 'failed' }} |`,
              `| Type check | ${{ steps.typecheck.outcome }} |`,
              `| Lint | ${{ steps.lint.outcome }} |`,
              `| Format | ${{ steps.format.outcome }} |`,
            ].join('\n');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail on coverage test failure
        if: steps.coverage.outputs.status != '0'
        run: exit 1

      - name: Fail on check failure
        if: steps.typecheck.outcome != 'success' || steps.lint.outcome != 'success' || steps.format.outcome != 'success'
        run: exit 1
